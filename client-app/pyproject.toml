[project]
name = "app"
version = "0.1.0"
description = ""
authors = [
    {name = "nansystem",email = "sato171786@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "python-multipart (>=0.0.32,<0.1.0)",
    "itsdangerous (>=2.2.0,<3.0.0)",
    "sqlalchemy (>=2.1.6,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "bcrypt (>=4.3.0,<5.0.0)"
]

[tool.poetry]
name = "client-app"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.162.0"
uvicorn = "^0.54.0"
sqlalchemy = "^2.1.6"
python-multipart = "^0.0.32"
jinja2 = "^3.1.6"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = ">=4.3.0,<5.0.0"
python-dotenv = "^1.2.4"
requests = "^2.31.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
httpx2 = "^2.16.0"
ruff = "^0.17.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[virtualenvs]
in-project = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
